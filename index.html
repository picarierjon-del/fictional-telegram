  const renderOrdersPrintRouterBase=renderOrders;
  renderOrders=function(){const out=renderOrdersPrintRouterBase();$$('#view-orders .order-card').forEach(card=>{const actions=$('.order-actions',card),id=card.dataset.order;if(actions&&id&&!actions.querySelector('[data-action="v12-order-print"]'))actions.insertAdjacentHTML('beforeend',`<button class="btn ghost small" data-action="v12-order-print" data-id="${esc(id)}">\ud83d\udda8 Postazioni</button>`)});return out};
  function openOrderPrintChooser(order){const sts=ensurePrintStationsV12().filter(st=>st.enabled&&stationAcceptsMode(st,order.mode));openEditor(`Stampa ordine #${order.id}`,`<div class="stack"><div class="notice">Scegli liberamente postazioni e numero copie.</div>${sts.map(st=>`<div class="setting-row"><label class="switch"><input type="checkbox" name="op-${st.id}" checked> <b>${esc(st.name)}</b> \u00b7 ${esc(st.role||'')}</label>${numField('Copie',`opc-${st.id}`,st.copies||1,1,9,1)}</div>`).join('')||'<div class="empty">Nessuna postazione attiva</div>'}</div>`,fd=>{const plan=sts.filter(st=>fd.has(`op-${st.id}`)).map(st=>({stationId:st.id,copies:Math.max(1,Math.min(9,+fd.get(`opc-${st.id}`)||st.copies||1)),selected:true}));dispatchConfiguredPrint(order,plan,true);return true})}

  document.addEventListener('click',e=>{const b=e.target.closest('button[data-action^="v12-"]');if(!b)return;const a=b.dataset.action;if(!['v12-add-station','v12-copy-station','v12-delete-station','v12-test-station','v12-copy-from-first','v12-run-print-queue','v12-clear-printed','v12-order-print'].includes(a))return;e.preventDefault();e.stopImmediatePropagation();ensurePrintStationsV12();
    if(a==='v12-add-station'){readStationSettingsFromDom();const x=v12StationDefaults(state.settings.print.stations.length);x.enabled=true;state.settings.print.stations.push(x);save('nuova postazione stampa');renderSettings()}
    if(a==='v12-copy-station'){readStationSettingsFromDom();const src=state.settings.print.stations.find(x=>x.id===b.dataset.id);if(src){const copy=clone(src);copy.id=v12StationDefaults().id;copy.name=`${src.name} copia`;state.settings.print.stations.push(copy);save('postazione duplicata');renderSettings()}}
    if(a==='v12-delete-station'){if(state.settings.print.stations.length>1&&confirm('Eliminare questa postazione di stampa?')){state.settings.print.stations=state.settings.print.stations.filter(x=>x.id!==b.dataset.id);save('postazione eliminata');renderSettings()}}
    if(a==='v12-copy-from-first'){readStationSettingsFromDom();const first=state.settings.print.stations[0],dst=state.settings.print.stations.find(x=>x.id===b.dataset.id);if(first&&dst&&first!==dst){const keep={id:dst.id,name:dst.name};Object.assign(dst,clone(first),keep);save('impostazioni stampa copiate');renderSettings();toast('Impostazioni copiate da Postazione 1')}}
    if(a==='v12-test-station'){readStationSettingsFromDom();save('test postazione');dispatchConfiguredPrint(samplePrintOrderV12(),[{stationId:b.dataset.id,copies:1}],true)}
    if(a==='v12-run-print-queue')runNextPrintJob();
    if(a==='v12-clear-printed'){state.printQueue=state.printQueue.filter(x=>!['printed','error'].includes(x.status));save('pulizia coda stampa');renderSettings();toast('Coda stampa pulita')}
    if(a==='v12-order-print'){const order=findOrder(b.dataset.id)||state.archive.find(o=>o.id===b.dataset.id);if(order)openOrderPrintChooser(order)}
  },true);

  /* Diagnostica/stress test interno non distruttivo: genera dati in memoria e verifica routing/totali. */
  function v12PrintStressTest(count=5000,targetRevenue=10000){ensurePrintStationsV12();const n=Math.max(1,Math.min(10000,+count||5000)),each=targetRevenue/n,orders=[];for(let i=0;i<n;i++)orders.push({id:`T${i+1}`,dateTime:new Date(2026,8,12,17+(i%6),i%60).toISOString(),mode:i%3===0?'delivery':i%3===1?'pickup':'counter',customer:`Cliente ${i}`,phone:`3${String(i).padStart(9,'0')}`,address:`Via Test ${i}`,payment:i%2?'Contanti':'Carta',total:each,lines:[{productId:state.categories?.[0]?.items?.[0]?.id||'',name:'Pizza Test',qty:1,unitPrice:each,modifiers:i%5===0?[{name:'Aggiunta',price:.5}]:[]}]});const total=orders.reduce((a,o)=>a+o.total,0),jobs=orders.reduce((a,o)=>a+printPlanDefaults(o.mode).length,0),copies=orders.reduce((a,o)=>a+printPlanDefaults(o.mode).reduce((n,p)=>n+p.copies,0),0);return{ok:orders.length===n&&Math.abs(total-targetRevenue)<.01&&jobs>=0&&copies>=jobs,orders:n,revenue:+total.toFixed(2),jobs,copies,stations:ensurePrintStationsV12().length,at:new Date().toISOString()}}
  window.PizzeriaSmartV12Print={version:V12_PRINT_ROUTER_VERSION,stations:ensurePrintStationsV12,dispatch:dispatchConfiguredPrint,queue:()=>state.printQueue,stress:v12PrintStressTest};

  load();
  
  /* V12.1 - FILTRI MODIFICATORI NELL'INSERIMENTO PRINCIPALE
     Mantiene separata la ricerca per ogni gruppo: Piu, Senza, Poco, Abbondante, ecc. */
  ui.modSearchByGroup = ui.modSearchByGroup || {};

  function v121InstallMainModifierFilter(){
    const view = $('#view-entry');
    if(!view || ui.selectedLine===null || ui.selectedLine===undefined) return;

    const group = activeMods();
    if(!group) return;

    /* Individua la card "Modifica: ..." senza toccare il multigusto. */
    const cards = $$('.card', view);
    const card = cards.find(c => {
      const h = c.querySelector('h3');
      return h && /^Modifica:/.test(h.textContent || '');
    });
    if(!card) return;

    const tabs = card.querySelector('.tabs');
    const products = card.querySelector('.grid.products');
    if(!tabs || !products) return;

    let wrap = card.querySelector('.v121-main-mod-search');
    if(!wrap){
      wrap = document.createElement('div');
      wrap.className = 'v121-main-mod-search search';
      wrap.style.margin = '8px 0 10px';
      tabs.insertAdjacentElement('afterend', wrap);
    }

    const q = ui.modSearchByGroup[group.id] || '';
    wrap.innerHTML = `<input class="input" id="mainModifierSearchV121"
      value="${esc(q)}"
      placeholder="Cerca in ${esc(group.name)}..."
      autocomplete="off"
      aria-label="Cerca modificatore in ${esc(group.name)}">`;

    const apply = value => {
      const query = String(value || '').trim().toLowerCase();
      ui.modSearchByGroup[group.id] = value || '';
      let visible = 0;

      $$('button.product[data-mod]', products).forEach(btn => {
        const hay = (btn.textContent || '').toLowerCase();
        const show = !query || hay.includes(query);
        btn.style.display = show ? '' : 'none';
        if(show) visible++;
      });

      let empty = products.querySelector('.v121-no-mod-results');
      if(!visible && query){
        if(!empty){
          empty = document.createElement('div');
          empty.className = 'empty v121-no-mod-results';
          products.appendChild(empty);
        }
        empty.textContent = `Nessun modificatore trovato in ${group.name}`;
      }else if(empty){
        empty.remove();
      }
    };

    const input = wrap.querySelector('#mainModifierSearchV121');
    if(input){
      input.oninput = () => apply(input.value);
      apply(q);
    }
  }

  const renderEntryV121MainModifierFilter = renderEntry;
  renderEntry = function(){
    const out = renderEntryV121MainModifierFilter();
    v121InstallMainModifierFilter();
    return out;
  };

</script>
</body>
