  const today=()=>nowLocal().slice(0,10);
  const DEFAULTS={version:2,settings:{businessName:'Pizzeria Smart',currency:'\u20ac',accent:'#c41424',accent2:'#8f0c18',background:'#f3f5f8',appFont:16,defaultLeadMinutes:30,deliveryEnabled:true,showPhone:true,showAddress:true,showTable:true,showNotes:true,showPayment:true,labels:{entry:'Inserimento',orders:'Ordini',history:'Storico',settings:'Impostazioni',customer:'Cliente',notes:'Note',delivery:'Consegna',pickup:'Asporto',counter:'Banco',newOrder:'Nuovo ordine',currentOrder:'Ordine corrente',total:'Totale',finalize:'Finalizza ordine',productSearch:'Cerca prodotto\u2026',kitchenMode:'Modalit\u00e0 cucina',advance:'Avanza stato',kitchenPrint:'Comanda',receipt:'Riepilogo',whatsapp:'WhatsApp',duplicate:'Duplica',close:'Chiudi'},statuses:[{id:'new',name:'Nuovo',color:'#c41424'},{id:'prep',name:'Preparazione',color:'#d17700'},{id:'oven',name:'Forno',color:'#7c3aed'},{id:'ready',name:'Pronto',color:'#168a52'},{id:'delivery',name:'In consegna',color:'#1769aa'}],print:{businessName:'Pizzeria Smart',header:'',footer:'Grazie',paperWidth:80,font:'Arial',bodySize:12,titleSize:19,headingSize:15,totalSize:18,showCustomer:true,showPhone:true,showAddress:true,showPayment:true,showPrices:true,showFooter:true,autoPrintKitchen:false}},categories:[{id:'cat_pizze',name:'Pizze',type:'standard',enabled:true,items:[{id:uid('p'),name:'Margherita',price:5,soldOut:false},{id:uid('p'),name:'Diavola',price:7.5,soldOut:false},{id:uid('p'),name:'Quattro Formaggi',price:9,soldOut:false}]},{id:'cat_bibite',name:'Bibite',type:'standard',enabled:true,items:[{id:uid('p'),name:'Acqua 1L',price:1.5,soldOut:false},{id:uid('p'),name:'Coca-Cola 33cl',price:2.5,soldOut:false}]},{id:'cat_meta',name:'Pizza met\u00e0',type:'multi',enabled:true,slots:2,priceRule:'highest',basePrice:0,items:[{id:uid('p'),name:'Pizza divisa a met\u00e0',price:0,soldOut:false}]},{id:'cat_metro',name:'Mezzo metro',type:'multi',enabled:true,slots:3,priceRule:'fixed',basePrice:17,items:[{id:uid('p'),name:'Mezzo metro 3 gusti',price:17,soldOut:false}]}],modifierGroups:[{id:'mg_plus',name:'Pi\u00f9',style:'plus',items:[{id:uid('m'),name:'Extra mozzarella',price:1.5,soldOut:false},{id:uid('m'),name:'Doppia salsiccia',price:2,soldOut:false}]},{id:'mg_without',name:'Senza',style:'minus',items:[{id:uid('m'),name:'Senza olive',price:0,soldOut:false}]},{id:'mg_little',name:'Poco',style:'little',items:[{id:uid('m'),name:'Poco cotta',price:0,soldOut:false}]},{id:'mg_more',name:'Abbondante',style:'more',items:[{id:uid('m'),name:'Basilico abbondante',price:0,soldOut:false}]}],zones:[{id:uid('z'),name:'Poncarale',price:3},{id:uid('z'),name:'Capriano del Colle',price:3},{id:uid('z'),name:'Borgosatollo',price:3}],drivers:[{id:uid('d'),name:'Fattorino 1',active:true}],customers:[],orders:[],archive:[]};
  let state=clone(DEFAULTS),ui={view:'entry',category:'cat_pizze',modGroup:'mg_plus',search:'',selectedLine:null,settingsTab:'general',historyDate:today(),orderSearch:'',lastSaved:null};
  const DB={name:'PizzeriaSmartV2',store:'state',db:null,async open(){if(this.db)return this.db;return new Promise(res=>{if(!('indexedDB' in window))return res(null);const q=indexedDB.open(this.name,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(this.store))q.result.createObjectStore(this.store)};q.onsuccess=()=>res(this.db=q.result);q.onerror=()=>res(null)})},async get(){const db=await this.open();if(!db)return null;return new Promise(res=>{const q=db.transaction(this.store).objectStore(this.store).get('main');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},async put(data){const db=await this.open();if(!db)return false;return new Promise(res=>{const tx=db.transaction(this.store,'readwrite');tx.objectStore(this.store).put(data,'main');tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)})}};

  function repairText(value){
    if(typeof value==='string'){
      const direct=[['\u00e2\u201a\u00ac','\u20ac'],['\u00e2\u20ac\u00a6','\u2026'],['\u00e2\u20ac\u2122','\u2019'],['\u00e2\u20ac\u201c','\u2013'],['\u00e2\u20ac\u201d','\u2014'],['\u00c2\u00b7','\u00b7'],['\u00c2\u00a0',' '],['\u00c3\u00a0','\u00e0'],['\u00c3\u00a8','\u00e8'],['\u00c3\u00a9','\u00e9'],['\u00c3\u00ac','\u00ec'],['\u00c3\u00b2','\u00f2'],['\u00c3\u00b9','\u00f9'],['\u00c3\u00c8','\u00c8'],['\u00c3\u00c9','\u00c9']];

  $('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.settings||!Array.isArray(data.categories))throw Error();if(confirm('Sostituire tutti i dati con questo backup?')){state=mergeDefaults(data);save();renderAll();toast('Backup ripristinato')}}catch{alert('Backup non valido')}e.target.value=''})
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=5').then(r=>r.update()).catch(()=>{});
  window.addEventListener('beforeunload',()=>{try{localStorage.setItem('pizzeria_smart_v2',JSON.stringify(state))}catch{}});
  load();
  </script>
</body>
</html>
