e:17,soldOut:false}]}],modifierGroups:[{id:'mg_plus',name:'Pi\u00f9',style:'plus',items:[{id:uid('m'),name:'Extra mozzarella',price:1.5,soldOut:false},{id:uid('m'),name:'Doppia salsiccia',price:2,soldOut:false}]},{id:'mg_without',name:'Senza',style:'minus',items:[{id:uid('m'),name:'Senza olive',price:0,soldOut:false}]},{id:'mg_little',name:'Poco',style:'little',items:[{id:uid('m'),name:'Poco cotta',price:0,soldOut:false}]},{id:'mg_more',name:'Abbondante',style:'more',items:[{id:uid('m'),name:'Basilico abbondante',price:0,soldOut:false}]}],zones:[{id:uid('z'),name:'Poncarale',price:3},{id:uid('z'),name:'Capriano del Colle',price:3},{id:uid('z'),name:'Borgosatollo',price:3}],drivers:[{id:uid('d'),name:'Fattorino 1',active:true}],customers:[],orders:[],archive:[]};

  function repairText(value){

      const direct=[['\u00e2\u201a\u00ac','\u20ac'],['\u00e2\u20ac\u00a6','\u2026'],['\u00e2\u20ac\u2122','\u2019'],['\u00e2\u20ac\u201c','\u2013'],['\u00e2\u20ac\u201d','\u2014'],['\u00c2\u00b7','\u00b7'],['\u00c2\u00a0',' '],['\u00c3\u00a0','\u00e0'],['\u00c3\u00a8','\u00e8'],['\u00c3\u00a9','\u00e9'],['\u00c3\u00ac','\u00ec'],['\u00c3\u00b2','\u00f2'],['\u00c3\u00b9','\u00f9'],['\u00c3\u00c8','\u00c8'],['\u00c3\u00c9','\u00c9']];

  }

  function capacityInfo(dateTime){const cfg=state.settings.capacity||{enabled:true,limit:15,minutes:5},ms=Math.max(5,+cfg.minutes||5)*60000,t=new Date(dateTime).getTime(),start=Math.floor(t/ms)*ms,end=start+ms,editingId=state.draft?.editingOrderId,orders=[...state.orders,...state.archive].filter(o=>{const x=new Date(o.dateTime).getTime();return o.id!==editingId&&x>=start&&x<end}),used=orders.reduce((n,o)=>n+pizzaUnits(o.lines),0),incoming=pizzaUnits(state.draft?.lines),limit=Math.max(1,+cfg.limit||15);return{used,incoming,total:used+incoming,limit,start,end,over:used+incoming>limit}}
  
  function openFinalize(){

        <div class="field"><label>Fattorino</label><select class="input" name="driverId"><option value="">Da assegnare</option>${drivers.map(x=>`<option value="${x.id}" ${d.driverId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>

  }

  function zonePrice(id){return Number(state.zones.find(z=>z.id===id)?.price||0)}function finalTotal(d){return d.lines.reduce((a,l)=>a+lineTotal(l),0)+(d.mode==='delivery'?zonePrice(d.zoneId):0)}function nextOrderId(){const all=[...state.orders,...state.archive].map(o=>Number(o.id)).filter(Number.isFinite);return String((Math.max(0,...all)+1)).padStart(3,'0')}function upsertCustomer(o,list){if(!o.phone&&!o.customer)return list;const found=list.find(c=>o.phone&&c.phone===o.phone);if(found)Object.assign(found,{name:o.customer,address:o.address,lastOrder:new Date().toISOString()});else list.push({id:uid('c'),name:o.customer,phone:o.phone,address:o.address,lastOrder:new Date().toISOString()});return list}
  function findOrder(id,archive=false){return (archive?state.archive:state.orders).find(o=>o.id===id)||state.archive.find(o=>o.id===id)}function advanceOrder(o){const a=state.settings.statuses,i=Math.max(0,a.findIndex(x=>x.id===o.status));o.status=a[Math.min(i+1,a.length-1)]?.id||o.status;save();renderOrders()}function archiveOrder(o){state.orders=state.orders.filter(x=>x.id!==o.id);o.closedAt=new Date().toISOString();state.archive.push(o);save();renderAll();toast('Ordine archiviato')}function duplicateOrder(o){state.draft={...clone(o),lines:clone(o.lines),dateTime:addMinutes(state.settings.defaultLeadMinutes)};delete state.draft.id;delete state.draft.status;delete state.draft.createdAt;delete state.draft.closedAt;ui.selectedLine=null;showView('entry');renderEntry();save();toast('Ordine copiato nel carrello')}
  function printMod(m){const cls=m.printStyle==='highlight'?'mod-highlight':m.printStyle==='bold'?'mod-bold':'mod-normal';return `<span class="print-mod ${cls}">+ ${esc(m.name)}</span>`}
  function printOrder(o,type){const p=state.settings.print,driver=state.drivers.find(d=>d.id===o.driverId);document.documentElement.style.setProperty('--print-width',`${p.paperWidth}mm`);document.documentElement.style.setProperty('--print-font',p.font);document.documentElement.style.setProperty('--print-body-size',`${p.bodySize}px`);document.documentElement.style.setProperty('--print-title-size',`${p.titleSize}px`);document.documentElement.style.setProperty('--print-heading-size',`${p.headingSize}px`);document.documentElement.style.setProperty('--print-total-size',`${p.totalSize}px`);$('#print-area').innerHTML=`<h1>${esc(p.businessName)}</h1>${p.header?`<div style="text-align:center">${esc(p.header)}</div>`:''}<h2>${type==='kitchen'?'COMANDA CUCINA':'RIEPILOGO ORDINE'} #${esc(o.id)}</h2><div><b>${new Date(o.dateTime).toLocaleString('it-IT')}</b> \u00b7 ${esc(o.mode)}</div>${o.customer?`<div><b>Cliente:</b> ${esc(o.customer)}</div>`:''}${p.showPhone&&o.phone?`<div><b>Tel:</b> ${esc(o.phone)}</div>`:''}${p.showAddress&&o.address?`<div><b>Indirizzo:</b> ${esc(o.address)}</div>`:''}${driver?`<div><b>Fattorino:</b> ${esc(driver.name)}</div>`:''}<div class="cut"></div>${o.lines.map(l=>`<div style="border-bottom:2px solid #000;padding:6px 0"><div class="print-line"><b>${l.qty}\u00d7 ${esc(l.name)}</b>${p.showPrices&&type!=='kitchen'?`<b>${money(lineTotal(l))}</b>`:''}</div>${l.slots?.map((s,i)=>`<div class="print-taste"><b>GUSTO ${i+1}: ${esc(s.taste)}</b>${(s.modifiers||[]).map(printMod).join('')}</div>`).join('')||''}${(l.modifiers||[]).map(printMod).join('')}</div>`).join('')}${o.notes?`<div class="print-note">NOTE: ${esc(o.notes)}</div>`:''}${type!=='kitchen'?`<div class="print-total print-line"><span>TOTALE</span><span>${money(o.total)}</span></div>${p.showPayment?`<div>Pagamento: ${esc(o.payment||'')}</div>`:''}`:''}${p.showFooter?`<div class="cut"></div><div style="text-align:center">${esc(p.footer)}</div>`:''}`;setTimeout(()=>window.print(),80)}
  function saveSettingsForm(){const f=$('#view-settings'),s=state.settings,p=s.print;const val=n=>f.querySelector(`[name="${n}"]`)?.value,has=n=>!!f.querySelector(`[name="${n}"]`)?.checked;if(ui.settingsTab==='general'){s.businessName=val('set-business')||s.businessName;s.accent=val('set-accent')||s.accent;s.accent2=val('set-accent2')||s.accent2;s.background=val('set-background')||s.background;s.appFont=+val('set-appfont')||16;s.defaultLeadMinutes=+val('set-lead')||0;Object.keys(s.labels).forEach(k=>{const v=val(`label-${k}`);if(v)s.labels[k]=v});['showPhone','showAddress','showTable','showNotes','showPayment','deliveryEnabled'].forEach(k=>s[k]=has(k))}if(ui.settingsTab==='delivery'){s.capacity={enabled:has('capacity-enabled'),limit:Math.max(1,+val('capacity-limit')||15),minutes:Math.max(5,+val('capacity-minutes')||5)}}if(ui.settingsTab==='print'){['businessName','font','header','footer'].forEach(k=>p[k]=val(`print-${k}`)??p[k]);['paperWidth','bodySize','titleSize','headingSize','totalSize'].forEach(k=>p[k]=+val(`print-${k}`)||p[k]);['showCustomer','showPhone','showAddress','showPayment','showPrices','showFooter','autoPrintKitchen'].forEach(k=>p[k]=has(`print-${k}`))}save();applyTheme();renderAll();toast('Impostazioni salvate')}
  
  document.addEventListener('change', e => {
    const sel = e.target.closest('[data-driver-select]');
    if(sel){
      const id = sel.dataset.driverSelect, driverId = sel.value;
      const order = state.orders.find(o=>o.id===id) || state.archive.find(o=>o.id===id);
      if(order){ order.driverId = driverId; save(); toast('Fattorino aggiornato'); }
    }
  });

  document.addEventListener('click',e=>{
    const b=e.target.closest('button[data-action], button[data-cat], button[data-go], button[data-product], button[data-mod], button[data-modgroup], button[data-settingtab]');if(!b)return;
    const a=b.dataset.action, cat=b.dataset.cat, go=b.dataset.go, prod=b.dataset.product, mod=b.dataset.mod, mg=b.dataset.modgroup, stab=b.dataset.settingtab;
    if(go){showView(go);return}
    if(cat){ui.category=cat;ui.search='';renderEntry();return}
    if(mg){ui.modGroup=mg;renderEntry();return}
    if(stab){ui.settingsTab=stab;renderSettings();return}
    if(prod){const c=activeCat();const p=c?.items?.find(x=>x.id===prod)||(c?.type==='multi'?{id:prod,name:c.name,price:c.basePrice}:null);if(p)addProduct(c,p);return}
    if(mod){const mg=activeMods(),m=mg?.items?.find(x=>x.id===mod),sel=state.draft?.lines[ui.selectedLine];if(m&&sel){sel.modifiers.push({id:uid('m'),modifierId:m.id,name:m.name,price:+m.price,printStyle:m.printStyle||'normal'});save();renderEntry()}return}
    if(a==='clear-draft'){state.draft=null;ui.selectedLine=null;renderEntry();return}
    if(a==='finalize'){openFinalize();return}
    if(a==='qty-plus'){state.draft.lines[+b.dataset.index].qty++;save();renderEntry();return}
    if(a==='qty-minus'){const l=state.draft.lines[+b.dataset.index];l.qty=Math.max(1,l.qty-1);save();renderEntry();return}
    if(a==='remove-line'){state.draft.lines.splice(+b.dataset.index,1);if(ui.selectedLine>=state.draft.lines.length)ui.selectedLine=null;save();renderEntry();return}
    if(a==='edit-multi'){const l=state.draft.lines[+b.dataset.index],c=state.categories.find(x=>x.id===l.categoryId);if(c)composeMulti(c,{id:l.productId,name:l.name,price:l.unitPrice},+b.dataset.index);return}
    if(a==='advance-order'){const o=findOrder(b.dataset.id);if(o)advanceOrder(o);return}
    if(a==='edit-order'){openOrderForEdit(b.dataset.id);return}
    if(a==='print-kitchen'){const o=findOrder(b.dataset.id,b.dataset.archive);if(o)printOrder(o,'kitchen');return}
    if(a==='print-receipt'){const o=findOrder(b.dataset.id,b.dataset.archive);if(o)printOrder(o,'receipt');return}
    if(a==='share-order'){const o=findOrder(b.dataset.id,b.dataset.archive);if(o)shareOrder(o);return}
    if(a==='duplicate-order'){const o=findOrder(b.dataset.id,b.dataset.archive);if(o)duplicateOrder(o);return}
    if(a==='archive-order'){const o=findOrder(b.dataset.id);if(o)archiveOrder(o);return}
    if(a==='delete-archive'){const id=b.dataset.id;if(confirm('Eliminare questo ordine dallo storico?')){state.archive=state.archive.filter(o=>o.id!==id);save();renderHistory();toast('Eliminato')}}
    if(a==='kitchen-view'){document.body.classList.toggle('kitchen-mode');toast('Modalit\u00e0 cucina attivata/disattivata');return}
    if(a==='save-settings'){saveSettingsForm();return}
    if(a==='add-category')openCategory(null,b.dataset.type);
    if(a==='edit-category')openCategory(b.dataset.id);
    if(a==='delete-category'){if(confirm('Eliminare categoria?')){state.categories=state.categories.filter(x=>x.id!==b.dataset.id);save();renderAll()}}
    if(a==='manage-items')manageItems(b.dataset.id);
    if(a==='add-zone')openSimple('zone');
    if(a==='edit-zone')openSimple('zone',b.dataset.id);
    if(a==='delete-zone'){if(confirm('Eliminare zona?')){state.zones=state.zones.filter(x=>x.id!==b.dataset.id);save();renderAll()}}
    if(a==='add-driver')openSimple('driver');
    if(a==='edit-driver')openSimple('driver',b.dataset.id);
    if(a==='delete-driver'){if(confirm('Eliminare fattorino?')){state.drivers=state.drivers.filter(x=>x.id!==b.dataset.id);save();renderAll()}}
    if(a==='add-status')openSimple('status');
    if(a==='edit-status')openSimple('status',b.dataset.id);
    if(a==='delete-status'){if(confirm('Eliminare stato?')){state.settings.statuses=state.settings.statuses.filter(x=>x.id!==b.dataset.id);save();renderAll()}}
    if(a==='move-status'){const id=b.dataset.id,dir=+b.dataset.dir,arr=state.settings.statuses,i=arr.findIndex(x=>x.id===id);if(i>=0&&arr[i+dir]){const t=arr[i];arr[i]=arr[i+dir];arr[i+dir]=t;save();renderSettings()}}
    if(a==='add-modgroup')editModGroup(null);
    if(a==='edit-modgroup')editModGroup(state.modifierGroups.find(x=>x.id===b.dataset.id));
    if(a==='delete-modgroup'){if(confirm('Eliminare gruppo modificatori?')){state.modifierGroups=state.modifierGroups.filter(x=>x.id!==b.dataset.id);save();renderAll()}}
    if(a==='manage-moditems')manageModItems(b.dataset.id);
    if(a==='test-print'){printOrder({id:'TEST',dateTime:new Date().toISOString(),mode:'pickup',customer:'Mario Rossi',phone:'3331234567',address:'Via Roma 1',lines:[{qty:2,name:'Margherita',slots:[],modifiers:[{name:'Extra mozzarella'}]}],notes:'Ben cotta',total:10},'receipt')}
    if(a==='export-data'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pizzeria_smart_${today()}.json`;a.click();toast('Backup esportato')}
    if(a==='import-data'){$('#importFile').click()}
    if(a==='purge-active-orders'){if(confirm('Cancellare tutti gli ordini attivi?')){state.orders=[];save();renderAll();toast('Ordini attivi cancellati')}}
    if(a==='purge-history'){if(confirm('Cancellare tutto lo storico?')){state.archive=[];save();renderAll();toast('Storico cancellato')}}
    if(a==='purge-all-orders'){if(confirm('Cancellare tutti gli ordini attivi e lo storico?')){state.orders=[];state.archive=[];save();renderAll();toast('Tutti gli ordini eliminati')}}
    if(a==='reset-settings-safe'){if(confirm('Ripristinare solo colori e aspetto predefiniti?')){state.settings=clone(DEFAULTS.settings);save();renderAll();toast('Aspetto ripristinato')}}
  });

  document.addEventListener('input',e=>{
    if(e.target.id==='productSearch'){ui.search=e.target.value;renderEntry()}
    if(e.target.id==='orderSearch'){ui.orderSearch=e.target.value;renderOrders()}
    if(e.target.id==='historyDate'){ui.historyDate=e.target.value;renderHistory()}
  });

  document.addEventListener('click',e=>{
    const line=e.target.closest('.order-line');
    if(line&&!e.target.closest('button')){ui.selectedLine=+line.dataset.line;renderEntry()}
  });

  $('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=evt=>{try{state=mergeDefaults(JSON.parse(evt.target.result));save();renderAll();toast('Backup importato con successo')}catch{toast('File di backup non valido')}};r.readAsText(f)};
  load();
  </script>
</body>
