<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionale Pizzeria</title>
    <style>
        :root {
            --primary: #e65100;
            --primary-dark: #bf360c;
            --accent: #2e7d32;
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --border-color: #333333;
            --text-main: #f5f5f5;
            --text-muted: #b0b0b0;
            --danger: #d32f2f;
            --warning: #f57c00;
            --success: #388e3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .view-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: var(--bg-dark);
        }

        .view-section.active {
            display: flex;
        }

        /* VISTA CASSA / ORDINI */
        .pos-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .products-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
        }

        .categories-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .cat-btn {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }

        .cat-btn.active {
            background: var(--primary);
            border-color: var(--primary-dark);
        }

        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            overflow-y: auto;
            align-content: start;
            padding-right: 4px;
        }

        .product-card {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90px;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.97);
        }

        .product-card:hover {
            border-color: var(--primary);
        }

        .prod-name {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .prod-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 8px;
        }

        .cart-area {
            width: 360px;
            background: var(--surface-dark);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        .cart-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cart-item {
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #333;
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #181818;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s ease;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* MODALE MODIFICATORI / METÀ METÀ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-footer {
            padding: 14px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #252525;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .checkbox-label input {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🍕</span> Pizzeria Manager
        </div>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchView('pos')">Cassa</button>
            <button class="nav-btn" onclick="switchView('orders')">Ordini</button>
        </div>
    </header>

    <main>
        <!-- VISTA CASSA -->
        <section id="view-pos" class="view-section active pos-layout">
            <div class="products-area">
                <div class="categories-bar" id="categories-bar">
                    <!-- Generato via JS -->
                </div>
                <div class="products-grid" id="products-grid">
                    <!-- Generato via JS -->
                </div>
            </div>
            
            <div class="cart-area">
                <div class="cart-header">
                    <span>Comanda Corrente</span>
                    <span id="cart-item-count" style="font-size: 0.8rem; color: var(--text-muted);">0 articoli</span>
                </div>
                <div class="cart-items" id="cart-items">
                    <!-- Elementi carrello dinamici -->
                </div>
                <div class="cart-footer">
                    <div class="cart-total-row">
                        <span>Totale:</span>
                        <span id="cart-total">€ 0.00</span>
                    </div>
                    <button class="btn-primary" onclick="confermaOrdine()">Invia in Cucina / Stampa</button>
                </div>
            </div>
        </section>

        <!-- VISTA ORDINI -->
        <section id="view-orders" class="view-section" style="padding: 20px; flex-direction: column; gap: 12px;">
            <h2 style="font-size: 1.1rem; font-weight: 600;">Storico Ordini attivi</h2>
            <div id="orders-container" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1;">
                <!-- Storico ordini -->
            </div>
        </section>
    </main>

    <!-- MODALE PERSONALIZZAZIONE PRODOTTO -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-product-title">Personalizza</span>
                <button onclick="chiudiModale()" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body" id="modal-product-body">
                <!-- Opzioni dinamiche (es. giunta ingredienti, impasto) -->
            </div>
            <div class="modal-footer">
                <button class="btn-primary" style="flex:1;" onclick="aggiungiAlCarrelloConModifiche()">Conferma e Aggiungi</button>
            </div>
        </div>
    </div>

    <script>
        // Dati di esempio strutturati
        const categories = [
            { id: 'rosse', name: 'Pizze Rosse' },
            { id: 'bianche', name: 'Pizze Bianche' },
            { id: 'bevande', name: 'Bevande' }
        ];

        const products = [
            { id: 1, cat: 'rosse', name: 'Margherita', price: 6.50 },
            { id: 2, cat: 'rosse', name: 'Diavola', price: 8.00 },
            { id: 3, cat: 'rosse', name: 'Capricciosa', price: 8.50 },
            { id: 4, cat: 'bianche', name: 'Quattro Formaggi', price: 8.00 },
            { id: 5, cat: 'bianche', name: 'Wurstel e Patatine', price: 7.50 },
            { id: 6, cat: 'bevande', name: 'Coca Cola 33cl', price: 3.00 },
            { id: 7, cat: 'bevande', name: 'Acqua Naturale 50cl', price: 1.50 }
        ];

        let cart = [];
        let activeCategory = 'rosse';
        let activeProductForModal = null;
        let activeOrders = [];

        // Inizializzazione Interfaccia
        function init() {
            renderCategories();
            renderProducts(activeCategory);
            renderCart();
        }

        function switchView(viewName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

            if (viewName === 'pos') {
                event.target.classList.add('active');
                document.getElementById('view-pos').classList.add('active');
            } else if (viewName === 'orders') {
                event.target.classList.add('active');
                document.getElementById('view-orders').classList.add('active');
                renderOrders();
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories-bar');
            container.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
                    ${cat.name}
                </button>
            `).join('');
        }

        function selectCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderProducts(catId);
        }

        function renderProducts(catId) {
            const grid = document.getElementById('products-grid');
            const filtered = products.filter(p => p.cat === catId);
            
            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="handleProductClick(${p.id})">
                    <div class="prod-name">${p.name}</div>
                    <div class="prod-price">€ ${p.price.toFixed(2)}</div>
                </div>
            `).join('');
        }

        function handleProductClick(productId) {
            const product = products.find(p => p.id === productId);
            if (product.cat === 'bevande') {
                aggiungiDirettoAlCarrello(product);
            } else {
                apriModalePersonalizzazione(product);
            }
        }

        function aggiungiDirettoAlCarrello(product) {
            const existing = cart.find(item => item.id === product.id && (!item.modifiche || item.modifiche.length === 0));
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1, modifiche: [], uuid: Date.now() });
            }
            renderCart();
        }

        function apriModalePersonalizzazione(product) {
            activeProductForModal = product;
            document.getElementById('modal-product-title').innerText = product.name;
            
            const body = document.getElementById('modal-product-body');
            body.innerHTML = `
                <p style="font-size:0.85rem; color:var(--text-muted);">Aggiunte extra:</p>
                <label class="checkbox-label">
                    <input type="checkbox" value="Mozzarella di Bufala (+€2.00)" data-price="2.00"> Mozzarella di Bufala (+€2.00)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" value="Doppio Salame (+€1.50)" data-price="1.50"> Doppio Salame (+€1.50)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" value="Piccante (+€0.50)" data-price="0.50"> Olio Piccante (+€0.50)
                </label>
            `;
            
            document.getElementById('product-modal').classList.add('open');
        }

        function chiudiModale() {
            document.getElementById('product-modal').classList.remove('open');
            activeProductForModal = null;
        }

        function aggiungiAlCarrelloConModifiche() {
            if (!activeProductForModal) return;

            const checkboxes = document.querySelectorAll('#modal-product-body input[type="checkbox"]:checked');
            let extraPrice = 0;
            let modificheList = [];

            checkboxes.forEach(cb => {
                extraPrice += parseFloat(cb.dataset.price);
                modificheList.push(cb.value);
            });

            const finalPrice = activeProductForModal.price + extraPrice;

            cart.push({
                ...activeProductForModal,
                price: finalPrice,
                qty: 1,
                modifiche: modificheList,
                uuid: Date.now()
            });

            chiudiModale();
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const countEl = document.getElementById('cart-item-count');
            const totalEl = document.getElementById('cart-total');

            countEl.innerText = `${cart.reduce((acc, item) => acc + item.qty, 0)} articoli`;
            
            if (cart.length === 0) {
                container.innerHTML = `<div style="color:var(--text-muted); text-align:center; margin-top:20px; font-size:0.9rem;">Carrello vuoto</div>`;
                totalEl.innerText = `€ 0.00`;
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-row">
                        <span class="cart-item-title">${item.name}</span>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="decrementQty(${item.uuid})">-</button>
                            <span style="font-size:0.9rem; font-weight:600;">${item.qty}</span>
                            <button class="qty-btn" onclick="incrementQty(${item.uuid})">+</button>
                        </div>
                    </div>
                    ${item.modifiche && item.modifiche.length > 0 ? `<div style="font-size:0.75rem; color:var(--text-muted);">+ ${item.modifiche.join(', ')}</div>` : ''}
                    <div class="cart-item-row" style="margin-top: 4px;">
                        <span style="font-size:0.8rem; color:var(--text-muted);">€ ${(item.price * item.qty).toFixed(2)}</span>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            totalEl.innerText = `€ ${total.toFixed(2)}`;
        }

        function incrementQty(uuid) {
            const item = cart.find(i => i.uuid === uuid);
            if (item) {
                item.qty++;
                renderCart();
            }
        }

        function decrementQty(uuid) {
            const index = cart.findIndex(i => i.uuid === uuid);
            if (index !== -1) {
                if (cart[index].qty > 1) {
                    cart[index].qty--;
                } else {
                    cart.splice(index, 1);
                }
                renderCart();
            }
        }

        function confermaOrdine() {
            if (cart.length === 0) return;

            const newOrder = {
                id: Math.floor(100 + Math.random() * 900),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                items: [...cart],
                total: cart.reduce((acc, item) => acc + (item.price * item.qty), 0)
            };

            activeOrders.unshift(newOrder);
            cart = [];
            renderCart();
            alert(`Ordine #${newOrder.id} inviato correttamente in cucina!`);
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            if (activeOrders.length === 0) {
                container.innerHTML = `<div style="color:var(--text-muted); text-align:center; margin-top:40px;">Nessun ordine attivo</div>`;
                return;
            }

            container.innerHTML = activeOrders.map(o => `
                <div style="background:var(--surface-dark); border:1px solid var(--border-color); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:700; color:var(--primary);">Ordine #${o.id}</span>
                        <span style="font-size:0.85rem; color:var(--text-muted);">${o.time}</span>
                    </div>
                    <div style="font-size:0.85rem; color:var(--text-muted);">
                        ${o.items.map(i => `${i.qty}x ${i.name}`).join(', ')}
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                        <span style="font-weight:700;">Totale: € ${o.total.toFixed(2)}</span>
                        <button onclick="rimuoviOrdine(${o.id})" style="background:var(--danger); color:white; border:none; padding:6px 10px; border-radius:6px; font-size:0.75rem; font-weight:600; cursor:pointer;">Completato</button>
                    </div>
                </div>
            `).join('');
        }

        function rimuoviOrdine(orderId) {
            activeOrders = activeOrders.filter(o => o.id !== orderId);
            renderOrders();
        }

        // Avvio app
        window.onload = init;
    </script>
</body>
</html>
