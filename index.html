<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizzeria Manager Pro</title>
    <style>
        :root {
            --primary: #e65100;
            --primary-dark: #bf360c;
            --accent: #2e7d32;
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --surface-card: #252525;
            --border-color: #333333;
            --text-main: #f5f5f5;
            --text-muted: #b0b0b0;
            --danger: #d32f2f;
            --warning: #f57c00;
            --success: #388e3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        header {
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
        }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .view-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: var(--bg-dark);
        }

        .view-section.active {
            display: flex;
        }

        /* VISTA CASSA / ORDINI */
        .pos-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .products-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
        }

        .search-bar {
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .categories-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .cat-btn {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .cat-btn.active {
            background: var(--primary);
            border-color: var(--primary-dark);
        }

        .products-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            overflow-y: auto;
            align-content: start;
            padding-right: 4px;
        }

        .product-card {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 95px;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s;
        }

        .product-card:active {
            transform: scale(0.96);
            background: #252525;
        }

        .product-card:hover {
            border-color: var(--primary);
        }

        .prod-name {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .prod-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 8px;
        }

        /* CARRELLO / COMANDA */
        .cart-area {
            width: 380px;
            background: var(--surface-dark);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
        }

        .cart-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cart-item {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.2s;
        }

        .cart-item.editing {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #333;
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .qty-btn:active {
            background: #444;
        }

        .cart-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #181818;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s ease, transform 0.1s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        /* MODALE PERSONALIZZAZIONE AVANZATO */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(2px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-footer {
            padding: 14px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .section-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-card);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 0.85rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .checkbox-label input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .checkbox-label:hover {
            border-color: #555;
        }

        /* VISTA ORDINI / CUCINA */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding: 4px;
        }

        .order-card {
            background: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 4px solid var(--primary);
        }

        .order-card.urgent {
            border-left-color: var(--danger);
        }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>🍕</span> Pizzeria Manager Pro
        </div>
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchView('pos')">Cassa</button>
            <button class="nav-btn" onclick="switchView('orders')">Cucina / Ordini (<span id="orders-badge">0</span>)</button>
        </div>
    </header>

    <main>
        <!-- VISTA CASSA -->
        <section id="view-pos" class="view-section active pos-layout">
            <div class="products-area">
                <div class="search-bar">
                    <input type="text" id="product-search" class="search-input" placeholder="Cerca prodotto..." oninput="filterProducts(this.value)">
                </div>
                <div class="categories-bar" id="categories-bar">
                    <!-- Generato via JS -->
                </div>
                <div class="products-grid" id="products-grid">
                    <!-- Generato via JS -->
                </div>
            </div>
            
            <div class="cart-area">
                <div class="cart-header">
                    <span>Comanda Corrente</span>
                    <span id="cart-item-count" style="font-size: 0.8rem; color: var(--text-muted);">0 articoli</span>
                </div>
                <div class="cart-items" id="cart-items">
                    <!-- Elementi carrello dinamici -->
                </div>
                <div class="cart-footer">
                    <div class="cart-total-row">
                        <span>Totale:</span>
                        <span id="cart-total">€ 0.00</span>
                    </div>
                    <button class="btn-primary" onclick="confermaOrdine()">Invia in Cucina / Stampa</button>
                </div>
            </div>
        </section>

        <!-- VISTA ORDINI -->
        <section id="view-orders" class="view-section" style="padding: 16px; flex-direction: column; gap: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 1.1rem; font-weight: 600;">Monitor Comande Attive</h2>
                <span style="font-size: 0.85rem; color: var(--text-muted);" id="active-orders-count">Nessun ordine in corso</span>
            </div>
            <div id="orders-container" class="orders-grid">
                <!-- Storico ordini -->
            </div>
        </section>
    </main>

    <!-- MODALE PERSONALIZZAZIONE PRODOTTO -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-product-title">Personalizza</span>
                <button onclick="chiudiModale()" style="background:none; border:none; color:white; font-size:1.4rem; cursor:pointer; padding: 0 4px;">&times;</button>
            </div>
            <div class="modal-body" id="modal-product-body">
                <!-- Opzioni dinamiche -->
            </div>
            <div class="modal-footer">
                <button class="btn-primary" style="flex:1;" id="modal-confirm-btn" onclick="salvaPersonalizzazione()">Aggiungi alla Comanda</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            { id: 'rosse', name: 'Pizze Rosse' },
            { id: 'bianche', name: 'Pizze Bianche' },
            { id: 'speciali', name: 'Speciali' },
            { id: 'bevande', name: 'Bevande' }
        ];

        const products = [
            { id: 1, cat: 'rosse', name: 'Margherita', price: 6.50 },
            { id: 2, cat: 'rosse', name: 'Diavola', price: 8.00 },
            { id: 3, cat: 'rosse', name: 'Capricciosa', price: 8.50 },
            { id: 4, cat: 'bianche', name: 'Quattro Formaggi', price: 8.00 },
            { id: 5, cat: 'bianche', name: 'Wurstel e Patatine', price: 7.50 },
            { id: 6, cat: 'speciali', name: 'Nerano', price: 9.50 },
            { id: 7, cat: 'bevande', name: 'Coca Cola 33cl', price: 3.00 },
            { id: 8, cat: 'bevande', name: 'Acqua Naturale 50cl', price: 1.50 },
            { id: 9, cat: 'bevande', name: 'Birra Artigianale 33cl', price: 5.00 }
        ];

        const availableExtras = [
            { name: 'Mozzarella di Bufala', price: 2.00 },
            { name: 'Doppio Salame', price: 1.50 },
            { name: 'Olio Piccante', price: 0.50 },
            { name: 'Funghi Freschi', price: 1.50 },
            { name: 'Acciughe', price: 1.50 }
        ];

        let cart = [];
        let activeCategory = 'rosse';
        let activeOrders = [];
        let editingUuid = null; // Se non è null, stiamo modificando un elemento esistente nel carrello

        function init() {
            renderCategories();
            renderProducts(activeCategory);
            renderCart();
        }

        function switchView(viewName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

            if (viewName === 'pos') {
                event.target.classList.add('active');
                document.getElementById('view-pos').classList.add('active');
            } else if (viewName === 'orders') {
                event.target.classList.add('active');
                document.getElementById('view-orders').classList.add('active');
                renderOrders();
            }
        }

        function renderCategories() {
            const container = document.getElementById('categories-bar');
            container.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
                    ${cat.name}
                </button>
            `).join('');
        }

        function selectCategory(catId) {
            activeCategory = catId;
            document.getElementById('product-search').value = '';
            renderCategories();
            renderProducts(catId);
        }

        function renderProducts(catId) {
            const grid = document.getElementById('products-grid');
            const filtered = products.filter(p => p.cat === catId);
            grid.innerHTML = filtered.map(p => productCardHtml(p)).join('');
        }

        function filterProducts(query) {
            const grid = document.getElementById('products-grid');
            if (!query.trim()) {
                renderProducts(activeCategory);
                return;
            }
            const filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
            if (filtered.length === 0) {
                grid.innerHTML = `<div style="color:var(--text-muted); font-size:0.9rem; grid-column: 1/-1; text-align:center; padding:20px;">Nessun prodotto trovato</div>`;
                return;
            }
            grid.innerHTML = filtered.map(p => productCardHtml(p)).join('');
        }

        function productCardHtml(p) {
            return `
                <div class="product-card" onclick="handleProductClick(${p.id})">
                    <div class="prod-name">${p.name}</div>
                    <div class="prod-price">€ ${p.price.toFixed(2)}</div>
                </div>
            `;
        }

        function handleProductClick(productId) {
            const product = products.find(p => p.id === productId);
            if (product.cat === 'bevande') {
                aggiungiDirettoAlCarrello(product);
            } else {
                apriModalePersonalizzazione(product);
            }
        }

        function aggiungiDirettoAlCarrello(product) {
            const existing = cart.find(item => item.id === product.id && (!item.modifiche || item.modifiche.length === 0));
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, basePrice: product.price, qty: 1, modifiche: [], uuid: Date.now() });
            }
            renderCart();
        }

        // Apre il modale sia per un NUOVO inserimento sia per MODIFICARE un articolo esistente nel carrello
        function apriModalePersonalizzazione(product, cartItemUuid = null) {
            editingUuid = cartItemUuid;
            const modalTitle = document.getElementById('modal-product-title');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            
            let currentModifiche = [];
            if (editingUuid) {
                const item = cart.find(i => i.uuid === editingUuid);
                modalTitle.innerText = `Modifica: ${product.name}`;
                confirmBtn.innerText = 'Aggiorna Articolo';
                currentModifiche = item.modifiche || [];
            } else {
                modalTitle.innerText = product.name;
                confirmBtn.innerText = 'Aggiungi alla Comanda';
            }
            
            const body = document.getElementById('modal-product-body');
            body.innerHTML = `
                <input type="hidden" id="modal-product-id" value="${product.id}">
                <div>
                    <div class="section-label">Aggiunte & Extra</div>
                    <div class="options-grid">
                        ${availableExtras.map(extra => {
                            const isChecked = currentModifiche.some(m => m.name === extra.name);
                            return `
                                <label class="checkbox-label">
                                    <input type="checkbox" value="${extra.name}" data-price="${extra.price}" ${isChecked ? 'checked' : ''}>
                                    <span>${extra.name} (+€${extra.price.toFixed(2)})</span>
                                </label>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            
            document.getElementById('product-modal').classList.add('open');
        }

        function chiudiModale() {
            document.getElementById('product-modal').classList.remove('open');
            editingUuid = null;
        }

        function salvaPersonalizzazione() {
            const productId = parseInt(document.getElementById('modal-product-id').value);
            const product = products.find(p => p.id === productId);
            const checkboxes = document.querySelectorAll('#modal-product-body input[type="checkbox"]:checked');
            
            let extraPrice = 0;
            let modificheList = [];

            checkboxes.forEach(cb => {
                extraPrice += parseFloat(cb.dataset.price);
                modificheList.push({ name: cb.value, price: parseFloat(cb.dataset.price) });
            });

            const finalPrice = product.price + extraPrice;

            if (editingUuid) {
                // Aggiorna l'elemento esistente nel carrello
                const item = cart.find(i => i.uuid === editingUuid);
                if (item) {
                    item.price = finalPrice;
                    item.modifiche = modificheList;
                }
            } else {
                // Aggiunge un nuovo elemento
                cart.push({
                    ...product,
                    basePrice: product.price,
                    price: finalPrice,
                    qty: 1,
                    modifiche: modificheList,
                    uuid: Date.now()
                });
            }

            chiudiModale();
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const countEl = document.getElementById('cart-item-count');
            const totalEl = document.getElementById('cart-total');

            countEl.innerText = `${cart.reduce((acc, item) => acc + item.qty, 0)} articoli`;
            
            if (cart.length === 0) {
                container.innerHTML = `<div style="color:var(--text-muted); text-align:center; margin-top:20px; font-size:0.9rem;">Carrello vuoto</div>`;
                totalEl.innerText = `€ 0.00`;
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item ${editingUuid === item.uuid ? 'editing' : ''}">
                    <div class="cart-item-row">
                        <span class="cart-item-title" style="cursor:pointer;" onclick="richiediModificaItem(${item.uuid})" title="Clicca per modificare">${item.name} ✏️</span>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="decrementQty(${item.uuid})">-</button>
                            <span style="font-size:0.9rem; font-weight:600; min-width:16px; text-align:center;">${item.qty}</span>
                            <button class="qty-btn" onclick="incrementQty(${item.uuid})">+</button>
                        </div>
                    </div>
                    ${item.modifiche && item.modifiche.length > 0 ? `
                        <div style="font-size:0.75rem; color:var(--text-muted); cursor:pointer;" onclick="richiediModificaItem(${item.uuid})">
                            + ${item.modifiche.map(m => m.name).join(', ')}
                        </div>
                    ` : ''}
                    <div class="cart-item-row" style="margin-top: 4px;">
                        <span style="font-size:0.8rem; color:var(--text-muted);">€ ${(item.price * item.qty).toFixed(2)}</span>
                        <button onclick="rimuoviItemCarrello(${item.uuid})" style="background:none; border:none; color:var(--danger); font-size:0.75rem; cursor:pointer; font-weight:600;">Rimuovi</button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            totalEl.innerText = `€ ${total.toFixed(2)}`;
        }

        function richiediModificaItem(uuid) {
            const item = cart.find(i => i.uuid === uuid);
            if (!item) return;
            const product = products.find(p => p.id === item.id);
            if (product) {
                apriModalePersonalizzazione(product, uuid);
            }
        }

        function incrementQty(uuid) {
            const item = cart.find(i => i.uuid === uuid);
            if (item) {
                item.qty++;
                renderCart();
            }
        }

        function decrementQty(uuid) {
            const index = cart.findIndex(i => i.uuid === uuid);
            if (index !== -1) {
                if (cart[index].qty > 1) {
                    cart[index].qty--;
                } else {
                    cart.splice(index, 1);
                }
                renderCart();
            }
        }

        function rimuoviItemCarrello(uuid) {
            cart = cart.filter(i => i.uuid !== uuid);
            renderCart();
        }

        function confermaOrdine() {
            if (cart.length === 0) return;

            const newOrder = {
                id: Math.floor(100 + Math.random() * 900),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now(),
                items: [...cart],
                total: cart.reduce((acc, item) => acc + (item.price * item.qty), 0)
            };

            activeOrders.unshift(newOrder);
            cart = [];
            renderCart();
            document.getElementById('orders-badge').innerText = activeOrders.length;
            
            // Segnale visivo o feedback rapido
            alert(`Ordine #${newOrder.id} inviato correttamente in cucina!`);
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            const countEl = document.getElementById('active-orders-count');
            document.getElementById('orders-badge').innerText = activeOrders.length;

            if (activeOrders.length === 0) {
                countEl.innerText = `Nessun ordine in corso`;
                container.innerHTML = `<div style="color:var(--text-muted); text-align:center; margin-top:40px; grid-column: 1/-1;">Nessuna comanda attiva al momento</div>`;
                return;
            }

            countEl.innerText = `${activeOrders.length} ordini attivi`;

            container.innerHTML = activeOrders.map(o => {
                const minutesElapsed = Math.floor((Date.now() - o.timestamp) / 60000);
                const isUrgent = minutesElapsed > 25;

                return `
                    <div class="order-card ${isUrgent ? 'urgent' : ''}">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:700; color:var(--primary); font-size:1.05rem;">Ordine #${o.id}</span>
                            <div style="display:flex; gap:6px; align-items:center;">
                                <span style="font-size:0.75rem; background:#333; padding:2px 6px; border-radius:4px; color:${isUrgent ? '#ff5252' : 'var(--text-muted)'};">${minutesElapsed} min fa</span>
                            </div>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:4px; border-top:1px solid var(--border-color); border-bottom:1px solid var(--border-color); padding:8px 0;">
                            ${o.items.map(i => `
                                <div style="font-size:0.9rem; display:flex; justify-content:space-between;">
                                    <span><b>${i.qty}x</b> ${i.name}</span>
                                </div>
                                ${i.modifiche && i.modifiche.length > 0 ? `<div style="font-size:0.75rem; color:var(--text-muted); padding-left:14px;">+ ${i.modifiche.map(m => m.name).join(', ')}</div>` : ''}
                            `).join('')}
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:700;">Tot: € ${o.total.toFixed(2)}</span>
                            <button onclick="rimuoviOrdine(${o.id})" style="background:var(--success); color:white; border:none; padding:6px 12px; border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer;">Completato</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function rimuoviOrdine(orderId) {
            activeOrders = activeOrders.filter(o => o.id !== orderId);
            renderOrders();
        }

        window.onload = init;
    </script>
</body>
</html>
